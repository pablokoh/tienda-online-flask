{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5">
<div class="card form-shell"><div class="card-body p-4 p-lg-5">
<h1 class="h2 mb-4">Iniciar sesión</h1>
<form method="post">
    <div class="mb-3"><label class="form-label">Correo electrónico</label><input class="form-control" type="email" name="email" required autocomplete="email"></div>
    <div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control" type="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-brand w-100" type="submit">Ingresar</button>
</form>
<p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a></p>
</div></div></div></div>
{% endblock %}
