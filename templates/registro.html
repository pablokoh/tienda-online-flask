{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5">
<div class="card form-shell"><div class="card-body p-4 p-lg-5">
<h1 class="h2 mb-4">Crear cuenta</h1>
<form method="post">
    <div class="mb-3"><label class="form-label">Nombre completo</label><input class="form-control" name="nombre" required maxlength="100"></div>
    <div class="mb-3"><label class="form-label">Correo electrónico</label><input class="form-control" type="email" name="email" required autocomplete="email"></div>
    <div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control" type="password" name="password" minlength="6" required autocomplete="new-password"><div class="form-text">Mínimo 6 caracteres.</div></div>
    <button class="btn btn-brand w-100" type="submit">Registrarme</button>
</form>
<p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
</div></div></div></div>
{% endblock %}
